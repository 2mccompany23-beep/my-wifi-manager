<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" />

  <!-- Wi-Fi Waves with Glow -->
  <g filter="url(#glow)">
    <!-- Outer Arc -->
    <path d="M 128 236 A 170 170 0 0 1 384 236" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
    
    <!-- Middle Arc -->
    <path d="M 172 290 A 115 115 0 0 1 340 290" fill="none" stroke="url(#signalGrad)" stroke-width="28" stroke-linecap="round" />

    <!-- Inner Arc -->
    <path d="M 216 344 A 60 60 0 0 1 296 344" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />

    <!-- Core Signal Dot -->
    <circle cx="256" cy="392" r="22" fill="#38bdf8" />
  </g>

  <!-- 2MC Brand Pill Badge at Top -->
  <rect x="151" y="70" width="210" height="74" rx="37" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" />
  <text x="256" y="121" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">2MC</text>
</svg>
